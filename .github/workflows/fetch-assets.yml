name: Fetch README assets

on:
  workflow_dispatch:
  push:
    branches:
      - claude/readme-cleanup-updates-nle12q

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download GIF assets
        run: |
          mkdir -p assets
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          fetch() {
            # try the original source first, fall back to GitHub's camo cache
            curl -fsSL --retry 2 -A "$UA" -H "Accept: image/avif,image/webp,image/*,*/*;q=0.8" -o "$1" "$2" \
              || curl -fsSL --retry 2 -o "$1" "$3"
          }
          fetch assets/retro-banner.gif \
            "https://i.pinimg.com/originals/6e/3c/cf/6e3ccf016cd0f0eb897a22eb6134a413.gif" \
            "https://camo.githubusercontent.com/0c4a8d65d1d6e8e3212930c6ed6ca2ea680cb52716b3677899e4a6f9e9f199d8/68747470733a2f2f692e70696e696d672e636f6d2f6f726967696e616c732f36652f33632f63662f36653363636630313663643066306562383937613232656236313334613431332e676966"
          fetch assets/pacman-divider.gif \
            "https://i.pinimg.com/originals/11/4a/0b/114a0b2d354eab8ea1ecceb0d11f6c44.gif" \
            "https://camo.githubusercontent.com/f75539d6a24fa921eaafed484e536b9959dda8953211fe6a80ce21ae18cd8c86/68747470733a2f2f692e70696e696d672e636f6d2f6f726967696e616c732f31312f34612f30622f31313461306232643335346561623865613165636365623064313166366334342e676966"
          fetch assets/pixel-character.gif \
            "https://i.pinimg.com/originals/8a/cc/b5/8accb5ed7f9753e8fbffc65aa90e0b3c.gif" \
            "https://camo.githubusercontent.com/9b60e4016cb665820c4607abf6d03c56c8b8caf6996c4f1b052ec923d51c4fa4/68747470733a2f2f692e70696e696d672e636f6d2f6f726967696e616c732f38612f63632f62352f38616363623565643766393735336538666266666336356161393065306233632e676966"
          file assets/*.gif
          for f in assets/*.gif; do
            file "$f" | grep -q "GIF image data" || { echo "$f is not a GIF"; exit 1; }
          done

      - name: Commit assets to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Assets already up to date, nothing to commit."
          else
            git commit -m "chore: add README GIF assets (self-hosted copies of Pinterest GIFs)"
            git push
          fi
